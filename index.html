<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%2305070f%27/%3E%3Crect x=%271%27 y=%279%27 width=%275%27 height=%275%27 fill=%27%235f7492%27/%3E%3Crect x=%278%27 y=%272%27 width=%276%27 height=%276%27 fill=%27%2354a7a4%27/%3E%3Crect x=%2710%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%2305070f%27/%3E%3C/svg%3E">
<title>WFC Infinite Shmup Background — 3D</title>

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #04050b; overflow: hidden;
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb3c8; }
  canvas { display: block; }
  #hud   { position: fixed; left: 10px; top: 10px; pointer-events: none;
           text-shadow: 0 1px 3px #000; white-space: pre; font-size: 11px; }
  #help  { position: fixed; left: 10px; bottom: 10px; pointer-events: none;
           text-shadow: 0 1px 3px #000; opacity: .55; font-size: 11px; }
  #nav   { position: fixed; right: 12px; top: 10px; font-size: 11px; opacity: .75; }
  #nav a { color: #7ff0ff; text-decoration: none; border-bottom: 1px solid #7ff0ff59; }
  #nav a:hover { opacity: 1; }
</style>

<div id="hud"></div>
<div id="nav"><a href="./2d.html">2D 버전 →</a></div>
<div id="help">↑↓←→ / WASD 이동   SPACE 발사   R 시드변경   [ ] 속도   P 정지   C 카메라</div>

<script type="module">
"use strict";

import * as THREE from './vendor/three.module.min.js';
// 2D 버전(2d.html)과 완전히 동일한 솔버를 쓴다. 3D는 순수한 "뷰"일 뿐이다.
import { TS, InfiniteWFC, nearDensity, hash2, mulberry32 } from './wfc.js';

/* ══════════════════════════════════════════════════════════════════════════
   3D 뷰

   WFC 데이터가 유일한 진실이고 메시는 재활용되는 표현에 불과하다.
   논문은 collapse 하는 순간 Instantiate 했지만, 무한 맵에서는 오브젝트가
   끝없이 쌓이므로 불가능하다. 여기서는 InstancedMesh 풀을 고정 용량으로
   잡아두고 매 프레임 "보이는 행"만 행렬을 다시 쓴다.
   → 씬 그래프 노드 수가 스크롤 거리와 무관하게 일정하다.
   ══════════════════════════════════════════════════════════════════════════ */

const TILE = 1;              // 타일 한 칸의 월드 크기
const GRID_W = 20;           // 가로 폭 (고정)
const DRAW_ROWS = 46;        // 그리기 거리 (행)
const CAP_ROCK = 1500, CAP_STN = 500;

/* 3×3 위치코드 → 높이.
   중앙(MM)이 가장 높고 모서리가 가장 낮아 덩어리가 계단식 메사 실루엣이 된다.
   2D 버전의 "전부 축정렬 직사각형" 문제가 3D에서는 이 높이차로 상당히 풀린다. */
const HEIGHT = { MM: 1.00, UM: .72, DM: .72, ML: .72, MR: .72,
                 UL: .46, UR: .46, DL: .46, DR: .46 };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050b);
scene.fog = new THREE.Fog(0x04050b, DRAW_ROWS * 0.45, DRAW_ROWS * 0.95);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0x89a7d6, 0x0a0f1c, 1.15));
const key = new THREE.DirectionalLight(0xdce8ff, 1.5);
key.position.set(-6, 12, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x4fd8e0, 0.7);
rim.position.set(7, 3, -9);
scene.add(rim);

// 바닥에서 자라도록 지오메트리 원점을 아래로 내린다 → Y 스케일이 위로 늘어난다
const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);

const rockMesh = new THREE.InstancedMesh(
  box, new THREE.MeshStandardMaterial({ roughness: .92, metalness: .05 }), CAP_ROCK);
const stnMesh = new THREE.InstancedMesh(
  box, new THREE.MeshStandardMaterial({ roughness: .35, metalness: .75,
        emissive: 0x1d6a70, emissiveIntensity: .55 }), CAP_STN);
for (const m of [rockMesh, stnMesh]) {
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;          // 직접 컬링하므로 끈다
  scene.add(m);
}

// 별
const starGeo = new THREE.BufferGeometry();
{
  const n = 1400, p = new Float32Array(n * 3), r = mulberry32(7);
  for (let i = 0; i < n; i++) {
    p[i*3]   = (r() - .5) * 260;
    p[i*3+1] = (r() - .5) * 160 + 20;
    p[i*3+2] = (r() - .5) * 260;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(p, 3));
}
const stars = new THREE.Points(starGeo,
  new THREE.PointsMaterial({ color: 0x9fc0e8, size: .35, sizeAttenuation: true,
                             transparent: true, opacity: .8, fog: false }));
scene.add(stars);

// 자기 기체
const ship = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(.30, 1.05, 5).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0xe8f2ff, roughness: .3, metalness: .6 }));
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(.13, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffab55 }));
  glow.position.z = .55;
  ship.add(body, glow);
}
scene.add(ship);

// 탄환 풀 — 역시 고정 용량 재활용
const BULLET_CAP = 64;
const bulletMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(.09, .09, .7),
  new THREE.MeshBasicMaterial({ color: 0x86f4ff }), BULLET_CAP);
bulletMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bulletMesh.frustumCulled = false;
scene.add(bulletMesh);

/* ── 상태 ─────────────────────────────────────────────────────────────── */
let seed, wfc;
function reset(s) {
  seed = s >>> 0;
  wfc = new InfiniteWFC(GRID_W, seed, { density: nearDensity });
}
reset((Math.random() * 1e9) | 0);

let camRow = 0, speed = 6, paused = false, camMode = 0;
const shipPos = { x: 0, y: 0, vx: 0, vy: 0 };
const bullets = [];
const keys = new Set();

addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyR') { reset((Math.random() * 1e9) | 0); camRow = 0; }
  if (e.code === 'KeyP') paused = !paused;
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'BracketRight') speed = Math.min(40, speed * 1.25);
  if (e.code === 'BracketLeft')  speed = Math.max(0.5, speed / 1.25);
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── WFC 격자 → 인스턴스 행렬 ─────────────────────────────────────────── */
const HALF = GRID_W * TILE / 2;
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion();
const _p = new THREE.Vector3(), _s = new THREE.Vector3();
const _c = new THREE.Color();
let lastRock = 0, lastStn = 0;

function syncInstances() {
  const first = Math.max(0, Math.floor(camRow) - 3);
  const last  = first + DRAW_ROWS;
  wfc.row(last);            // 필요한 만큼만 앞서 생성
  wfc.prune(first - 6);     // 지나간 행은 해제 → 메모리 상수

  let ri = 0, si = 0;
  for (let y = first; y <= last; y++) {
    const row = wfc.row(y);
    for (let x = 0; x < GRID_W; x++) {
      const t = row[x];
      if (t === 0) continue;
      const meta = TS.meta[t];
      const h = hash2(x, y);
      const jitter = 0.86 + ((h & 0xff) / 255) * 0.30;   // 결정론적 높이 흔들기

      _p.set(x * TILE - HALF + TILE / 2, 0, -y * TILE);
      _q.identity();

      if (meta.kind === 'rock') {
        if (ri >= CAP_ROCK) continue;
        _s.set(TILE * .98, (HEIGHT[meta.pos] || .6) * 1.7 * jitter, TILE * .98);
        _m.compose(_p, _q, _s);
        rockMesh.setMatrixAt(ri, _m);
        const v = 0.72 + ((h >>> 9) & 0x3f) / 255;
        _c.setRGB(0.20 * v, 0.26 * v, 0.37 * v);
        rockMesh.setColorAt(ri, _c);
        ri++;
      } else {
        if (si >= CAP_STN) continue;
        // 링 구조물은 탑처럼 높게 세워 랜드마크로 읽히게 한다
        _s.set(TILE * .86, 2.6 * (0.94 + ((h >>> 3) & 0x1f) / 160), TILE * .86);
        _m.compose(_p, _q, _s);
        stnMesh.setMatrixAt(si, _m);
        const v = 0.85 + ((h >>> 11) & 0x3f) / 200;
        _c.setRGB(0.16 * v, 0.42 * v, 0.44 * v);
        stnMesh.setColorAt(si, _c);
        si++;
      }
    }
  }

  rockMesh.count = ri; stnMesh.count = si;
  rockMesh.instanceMatrix.needsUpdate = true;
  stnMesh.instanceMatrix.needsUpdate = true;
  if (rockMesh.instanceColor) rockMesh.instanceColor.needsUpdate = true;
  if (stnMesh.instanceColor)  stnMesh.instanceColor.needsUpdate = true;
  lastRock = ri; lastStn = si;
}

/* ── 업데이트 ─────────────────────────────────────────────────────────── */
let shootCd = 0;
function update(dt) {
  camRow += speed * dt;

  const ax = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const ay = (keys.has('ArrowUp')    || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0);
  shipPos.vx += ax * 46 * dt; shipPos.vy += ay * 34 * dt;
  shipPos.vx *= Math.pow(0.0022, dt); shipPos.vy *= Math.pow(0.0022, dt);
  shipPos.x = Math.max(-HALF + .8, Math.min(HALF - .8, shipPos.x + shipPos.vx * dt));
  shipPos.y = Math.max(-1.6, Math.min(4.5, shipPos.y + shipPos.vy * dt));

  const camZ = -camRow * TILE;
  ship.position.set(shipPos.x, 3.1 + shipPos.y, camZ - 6.5);
  ship.rotation.z = -shipPos.vx * 0.035;
  ship.rotation.x = shipPos.vy * 0.018;

  shootCd -= dt;
  if (keys.has('Space') && shootCd <= 0 && bullets.length < BULLET_CAP) {
    bullets.push({ x: ship.position.x, y: ship.position.y, z: ship.position.z, t: 0 });
    shootCd = 0.09;
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.z -= 46 * dt; b.t += dt;
    if (b.t > 1.4) bullets.splice(i, 1);
  }
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    _m.compose(_p.set(b.x, b.y, b.z), _q.identity(), _s.set(1, 1, 1));
    bulletMesh.setMatrixAt(i, _m);
  }
  bulletMesh.count = bullets.length;
  bulletMesh.instanceMatrix.needsUpdate = true;

  // 카메라 3종 (C 키)
  if (camMode === 0) {          // 기본: 뒤쪽 상단 추격
    camera.position.set(shipPos.x * .35, 7.4, camZ + 3.2);
    camera.lookAt(shipPos.x * .15, 1.0, camZ - 15);
  } else if (camMode === 1) {   // 탑다운: 2D 버전에 가까운 시점
    camera.position.set(0, 19, camZ - 8);
    camera.lookAt(0, 0, camZ - 9.5);
  } else {                      // 로우앵글: 실루엣 확인용
    camera.position.set(shipPos.x * .5, 2.0, camZ + 4.5);
    camera.lookAt(shipPos.x * .2, 1.6, camZ - 20);
  }
  stars.position.z = camZ;
}

/* ── 루프 ─────────────────────────────────────────────────────────────── */
const HUD = document.getElementById('hud');
let last = performance.now(), fps = 60, acc = 0, frames = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  syncInstances();
  renderer.render(scene, camera);

  acc += dt; frames++;
  if (acc > 0.4) { fps = frames / acc; acc = 0; frames = 0; }
  const s = wfc.stats;
  HUD.textContent =
    `seed ${seed}   row ${camRow.toFixed(0)}   speed ${speed.toFixed(1)}/s   ${fps.toFixed(0)}fps\n` +
    `band ${s.lastMs.toFixed(2)}ms  avg ${s.avgMs.toFixed(2)}ms  x${s.bands}\n` +
    `retry ${s.retries}   seam ${s.seams}   rows ${wfc.rows.size}\n` +
    `instances  rock ${lastRock}  station ${lastStn}   draws ${renderer.info.render.calls}\n` +
    `density ${nearDensity(camRow).toFixed(2)}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 헤드리스 테스트에서 들여다볼 수 있게
window.__wfc = { get wfc() { return wfc; }, TS, InfiniteWFC, nearDensity,
                 get counts() { return { rock: lastRock, stn: lastStn }; } };
</script>
